<html>
<head>
<title>border property </title>
<style type="text/css">
body
{
background: linear-gradient(green,red); /* Gradient From Yellow to Orange * /
}
P 
{
border-top :5px solid blue; /* Border top With Blue Color */
border-radius : 10px; /* Rounded Corners */
}
</style>
</head>
<body>
<p style="border-style: ridge; border-color: red; border-width: thick;"> Hard work beats talent doesn't work hard. </p>
<p style="border-style: groove; border-color: blue; border-width: thick;"> Hard work beats talent doesn't work hard. </p>
<p style="border-style: dashed; border-color: lightgreen; border-width: thick;"> Hard work beats talent doesn't work hard. </p>
<p style="border-style: dotted; border-color: lightblue; border-width: thick;"> Hard work beats talent doesn't work hard. </p>
<p style="border-style: double; border-color: orange; border-width: thick;"> Hard work beats talent doesn't work hard. </p>
<p style="border-style: inset; border-color: black; border-width: thick;"> Hard work beats talent doesn't work hard. </p>
<p style="border-style: outset; border-color: white; border-width: thick;"> Hard work beats talent doesn't work hard. </p>
</body>
</html>
