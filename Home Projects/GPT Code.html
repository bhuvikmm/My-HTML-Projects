<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      display: grid;
      grid-template-areas: "sidebar header" "sidebar main";
      grid-template-columns: 250px 1fr;
      grid-template-rows: 60px 1fr;
      height: 100vh;
      background-color: #f4f4f4;
    }

    header {
      grid-area: header;
      background-color: #1a1a2e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    header h1 {
      font-size: 20px;
    }

    #sidebar {
      grid-area: sidebar;
      background-color: #16213e;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #sidebar h2 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #e94560;
    }

    #sidebar a {
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 5px;
      transition: background 0.3s;
    }

    #sidebar a:hover {
      background-color: #e94560;
    }

    main {
      grid-area: main;
      padding: 20px;
      overflow-y: auto;
    }

    .card {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .toggle-btn {
      display: none;
    }

    @media (max-width: 768px) {
      body {
        grid-template-columns: 1fr;
        grid-template-areas: "header" "main";
      }

      #sidebar {
        display: none;
        position: absolute;
        left: 0;
        top: 60px;
        width: 250px;
        height: calc(100% - 60px);
        background-color: #16213e;
        z-index: 1000;
      }

      .toggle-btn {
        display: block;
        cursor: pointer;
        font-size: 24px;
      }

      #sidebar.show {
        display: block;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="toggle-btn" onclick="toggleSidebar()">☰</div>
    <h1>Complex Admin Dashboard</h1>
    <div>User: Admin</div>
  </header>

  <nav id="sidebar">
    <h2>Navigation</h2>
    <a href="#">Dashboard</a>
    <a href="#">Reports</a>
    <a href="#">Analytics</a>
    <a href="#">Settings</a>
    <a href="#">Logout</a>
  </nav>

  <main>
    <div class="dashboard-grid">
      <div class="card">
        <h3>Welcome Admin</h3>
        <p>This is a detailed view of your admin dashboard.</p>
      </div>

      <div class="card">
        <h3>Key Metrics</h3>
        <ul>
          <li>Users: 1,245</li>
          <li>Sales: $23,400</li>
          <li>Active Sessions: 305</li>
        </ul>
      </div>

      <div class="card">
        <h3>Performance Chart</h3>
        <canvas id="performanceChart" width="400" height="200"></canvas>
      </div>

      <div class="card">
        <h3>System Logs</h3>
        <pre>
[
